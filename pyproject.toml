[project]
name = "ashare"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["panelbt", "panelops", "paperbroker", "httpx>=0.28.1", "polars>=1.35", "pyarrow>=21"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
panelbt = { workspace = true }
panelops = { workspace = true }
paperbroker = { workspace = true }

[dependency-groups]
compare = [
    "backtrader>=1.9.78.123",
    "bt>=1.4.1",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "psutil>=7.2.2",
    "vectorbt[rust]>=1.2.1",
]
data-verify = ["baostock>=0.8.9"]
dev = ["pytest>=9.2.0", "hypothesis>=6.170.15", "ruff>=0.17.4", "maturin>=1.16.0"]

[tool.pytest.ini_options]
testpaths = ["test", "packages/paperbroker/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
