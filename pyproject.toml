[project]
name = "ashare"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["panelbt", "panelops", "paperbroker", "portopt", "httpx>=0.28.1", "polars>=1.35", "pyarrow>=21", "scipy>=1.14", "cvxpy>=1.6", "clarabel>=0.11", "osqp>=1.0"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
panelbt = { workspace = true }
panelops = { workspace = true }
paperbroker = { workspace = true }
portopt = { workspace = true }

[dependency-groups]
compare = [
    "backtrader>=1.9.78.123",
    "bt>=1.4.1",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "psutil>=7.2.2",
    "vectorbt[rust]>=1.2.1",
]
data-verify = ["baostock>=0.8.9"]
dev = ["pytest>=9.2.0", "hypothesis>=6.170.15", "ruff>=0.17.4", "maturin>=1.16.0", {include-group = "risk-reference"}]
risk-reference = ["scikit-learn>=1.6", "threadpoolctl>=3.5"]
# 机器学习（ashare.ml）：树模型和线性模型。神经网络以后走单独的 nn 组，默认不装。
ml = ["lightgbm>=4.6", "scikit-learn>=1.6"]

panelops-bench = ["pandas>=2.2", "polars>=2.1", "bottleneck>=1.4"]
panelops-crosscheck = ["alphalens-reloaded>=0.4", "matplotlib>=3.9"]

[tool.pytest.ini_options]
testpaths = ["test", "packages/paperbroker/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
