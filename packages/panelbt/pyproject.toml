[project]
name = "panelbt"
version = "0.1.0"
description = "Deterministic market-agnostic panel portfolio backtesting with a Rust kernel"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1,<3"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]

[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "build_backend"
backend-path = ["."]

[tool.maturin]
python-source = "python"
module-name = "panelbt._core"
profile = "release"
strip = true
include = [{ path = "build_backend.py", format = "sdist" }]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "build_backend.py" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
  { file = "build.rs" },
  { file = "../../crates/panelbt-core/Cargo.toml" },
  { file = "../../crates/panelbt-core/src/**/*.rs" },
  { file = "../../Cargo.toml" },
  { file = "../../crates/tradecore/Cargo.toml" },
  { file = "../../crates/tradecore/src/**/*.rs" },
  { file = "../../Cargo.lock" },
  { file = "python/**/*.py" },
]
