[[mutant]]
file = "src/ashare/factor/groupbt/weights.py"
function = "group_demean"
change = "width = int(g[valid].max()) + 1  ->  width = int(g[valid].max()) + 2"
reason = "a wider stride still gives every (row, group) pair its own key; only existing keys are read back through total[key] / count[key]"

[[mutant]]
file = "src/ashare/factor/groupbt/weights.py"
function = "group_demean"
change = "total = np.bincount(key, weights=x[valid], minlength=size)  ->  total = np.bincount(key, weights=x[valid], )"
reason = "total is only read at existing keys (total[key]), all below len(total) without minlength"

[[mutant]]
file = "src/ashare/factor/groupbt/weights.py"
function = "group_demean"
change = "count = np.bincount(key, minlength=size)  ->  count = np.bincount(key, )"
reason = "count is only read at existing keys (count[key]), all below len(count) without minlength"

[[mutant]]
file = "src/ashare/factor/groupbt/metrics.py"
function = "risk_exposure"
change = "w = np.array(weights, dtype=np.float64, copy=True)  ->  w = np.array(weights, dtype=np.float64, copy=None)"
reason = "w is rebound by np.where on the next line and never written in place, so whether np.array copies does not matter"

[[mutant]]
file = "src/ashare/factor/groupbt/metrics.py"
function = "risk_exposure"
change = "w = np.array(weights, dtype=np.float64, copy=True)  ->  w = np.array(weights, dtype=np.float64, )"
reason = "copy defaults to True: identical call"

[[mutant]]
file = "src/ashare/factor/groupbt/metrics.py"
function = "risk_exposure"
change = "mean = np.divide(total, count, out=np.zeros_like(total), where=count > 0)  ->  mean = np.divide(total, count, out=None, where=count > 0)"
reason = "entries skipped by where stay uninitialised, but they belong to rows with count == 0, where valid is all False and np.where(valid, ..., 0.0) discards them"

[[mutant]]
file = "src/ashare/factor/groupbt/metrics.py"
function = "risk_exposure"
change = "mean = np.divide(total, count, out=np.zeros_like(total), where=count > 0)  ->  mean = np.divide(total, count, where=count > 0)"
reason = "same as out=None: the unwritten entries belong to rows with no valid cell and are discarded by np.where(valid, ...)"

[[mutant]]
