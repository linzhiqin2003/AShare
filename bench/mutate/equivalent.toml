# 等价变异登记：逐个看过、确认任何输入下行为都不变的存活变异。
# 登记后 make mutate-report（或下一次运行）会把它们移出分母，记为 equivalent。
#
# 按 (file, function, change) 匹配，change 照抄 .cache/testing/mutation_survivors.md 里的
# 「变异」一列；这样变异编号或行号变了也还能对上。函数改了导致对不上的条目会列在
# 存活清单开头，要么删掉，要么重新确认后改写。
#
# 只登记真正等价的：「测试没覆盖到」「影响很小」都不算，那些要补测试。
#
# [[mutant]]
# file = "src/ashare/..."            # 仓库相对路径
# function = "Class.method"          # Python：函数或 类.方法；Rust：cargo-mutants 的函数名
# change = "..."                     # 照抄存活清单
# reason = "为什么等价"

# ---------------------------------------------------------------- src/ashare/platform/config.py

[[mutant]]
file = "src/ashare/platform/config.py"
function = "expand_settings"
change = "config = dict(zip(options, row, strict=True))  ->  config = dict(zip(options, row, strict=None))"
reason = "row comes from itertools.product(*options.values()), so it always has len(options) items; strict never fires"

[[mutant]]
file = "src/ashare/platform/config.py"
function = "expand_settings"
change = "config = dict(zip(options, row, strict=True))  ->  config = dict(zip(options, row, ))"
reason = "same as strict=None: the two iterables always have equal length"

[[mutant]]
file = "src/ashare/platform/config.py"
function = "expand_settings"
change = "config = dict(zip(options, row, strict=True))  ->  config = dict(zip(options, row, strict=False))"
reason = "same as strict=None: the two iterables always have equal length"

[[mutant]]
file = "src/ashare/platform/config.py"
function = "max_workers"
change = "min(4, max(1, (os.cpu_count() or 2) // 2)),  ->  min(4, max(1, (os.cpu_count() or 2) / 2)),"
reason = "the default goes through int(); for a positive integer c, int(min(4, max(1, c / 2))) == min(4, max(1, c // 2))"

[[mutant]]
file = "src/ashare/platform/config.py"
function = "max_workers"
change = "min(4, max(1, (os.cpu_count() or 2) // 2)),  ->  min(4, max(1, (os.cpu_count() or 3) // 2)),"
reason = "only differs when cpu_count() is None, and then 2 // 2 == 3 // 2 == 1"

[[mutant]]
file = "src/ashare/platform/config.py"
function = "parallel_budget"
change = "cores = os.cpu_count() or 2  ->  cores = os.cpu_count() or 3"
reason = "only differs when cpu_count() is None: cores // 3 is then 0 or 1, and max(1, min(4, cores // 3, ...)) is 1 either way"

