reason = "only n == 1 changes path; the general loop with n = 1 has den = 1 and returns w with NaN restored, bit-identical to w.copy()"

[[mutant]]
file = "src/ashare/factor/groupbt/weights.py"
function = "group_demean"
change = "size = x.shape[0] * width  ->  size = x.shape[1] * width"
