# mutmut 3 的基础配置。pyproject.toml 里没有 [tool.mutmut]，mutmut 才会读这里。
# 不要在仓库根目录直接跑 `mutmut run`：测试的构建守卫要求 panelbt / panelops / paperbroker
# 都从被测副本里导入，只有 bench/mutate/run.py 会搭好这个环境（见 docs/TESTING_MUTATION.md）。
# 驱动按分片在 .cache/mutate/py/<分片>/ 下生成工作目录，读这一段，再改写 only_mutate 和
# pytest_add_cli_args_test_selection。
[mutmut]
source_paths = src
pytest_add_cli_args_test_selection = test
pytest_add_cli_args =
    -p
    no:randomly
    -p
    no:cacheprovider
    -q
# 分叉服务器在跑任何测试代码之前分叉：rayon、polars 的全局线程池不会在父进程里初始化，
# 子进程里用到它们也不会死锁。
process_isolation = forkserver
forkserver_warmup = none
timeout_multiplier = 10.0
timeout_constant = 30.0
# 不变异的文件：类型标注、常量表、纯数据。
do_not_mutate =
    */_version.py
